name: Build & deploy Android APK

# Compile l'APK Roamers Community dans le cloud (EAS Build) puis remplace
# public/downloads/roamers.apk et le commite — aucun PC requis.
#
# Déclenchement : onglet "Actions" du repo → "Build & deploy Android APK" →
# "Run workflow" (fonctionne depuis le navigateur mobile).
#
# Pré-requis (une seule fois, depuis ton téléphone) :
#   1. expo.dev → Account → Settings → Access Tokens → créer un token
#   2. GitHub → repo → Settings → Secrets and variables → Actions →
#      New repository secret → nom "EXPO_TOKEN", valeur = le token.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil EAS (doit produire un .apk)"
        required: false
        default: "preview"

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: roamers-mobile/package-lock.json

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: roamers-mobile
        run: npm ci

      - name: Build APK on EAS (cloud)
        id: build
        working-directory: roamers-mobile
        run: |
          set -euo pipefail
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          echo "Lancement du build EAS (profil: $PROFILE)…"
          eas build --platform android --profile "$PROFILE" --non-interactive --wait --json > build.json
          URL=$(node -e "const b=require('./build.json');const a=Array.isArray(b)?b[0]:b;const u=a.artifacts&&(a.artifacts.applicationArchiveUrl||a.artifacts.buildUrl);if(!u){console.error('Aucune URL d\\'artefact dans la réponse EAS');process.exit(1)}console.log(u)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "APK généré : $URL"

      - name: Download APK into repo
        run: |
          set -euo pipefail
          curl -L --fail "${{ steps.build.outputs.url }}" -o public/downloads/roamers.apk
          ls -lh public/downloads/roamers.apk

      - name: Commit & push APK
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/roamers.apk
          if git diff --staged --quiet; then
            echo "Aucun changement dans l'APK — rien à committer."
            exit 0
          fi
          VER=$(node -e "console.log(require('./roamers-mobile/app.json').expo.version)")
          CODE=$(node -e "console.log(require('./roamers-mobile/app.json').expo.android.versionCode)")
          git commit -m "chore: build APK v$VER (build $CODE) via EAS cloud"
          git push origin HEAD:${{ github.ref_name }}
